# Routed through the Traefik ingress controller bundled with Rancher Desktop.
# The rules have no host, so they match any address that reaches Traefik:
# http://localhost/, http://<this machine's IP>/, or any name pointing at it.
# Ingresses elsewhere in the cluster with a host rule still take precedence.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-storage
spec:
  stripPrefix:
    prefixes:
      - /storage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw-storage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: excalidraw-strip-storage@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /storage
            pathType: Prefix
            backend:
              service: {name: storage, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw
spec:
  rules:
    - http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service: {name: room, port: {number: 80}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
